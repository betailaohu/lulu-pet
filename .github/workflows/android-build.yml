name: Android build

# 本机 Windows 没有 JDK / Android SDK，用云端 CI 补上「首次编译验证」。
# 推送 android/ 或 shared/ 的改动就会自动编译出 debug APK，无需本地环境。
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/**'
      - 'assets/lulu/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK
        # ubuntu-latest 镜像自带 Android SDK，直接用，不再装第三方 setup-android。
        # 只在缺 platform-34 / build-tools 34.0.0 时补装。
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "--- 现有 platforms ---"; ls "$ANDROID_HOME/platforms" || true
          echo "--- 现有 build-tools ---"; ls "$ANDROID_HOME/build-tools" || true
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | "$SDKMANAGER" --install "platforms;android-34" > /dev/null
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            yes | "$SDKMANAGER" --install "build-tools;34.0.0" > /dev/null
          fi
          echo "--- 最终 ---"; ls "$ANDROID_HOME/platforms"; ls "$ANDROID_HOME/build-tools"

      - name: Static project checks (no build needed)
        run: |
          python3 .research/verify_project.py
          python3 .research/check_kotlin.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lulu-pet-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
