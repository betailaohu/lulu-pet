name: Android build

# 本机 Windows 没有 JDK / Android SDK，用云端 CI 补上「首次编译验证」。
# 推送 android/ 或 shared/ 的改动就会自动编译出 debug APK，无需本地环境。
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/**'
      - 'assets/lulu/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Static project checks (no build needed)
        run: |
          python3 .research/verify_project.py
          python3 .research/check_kotlin.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lulu-pet-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
